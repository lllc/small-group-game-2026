<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搶蛋糕 · 主持</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cake.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="avatars.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="top">
  <h1>搶蛋糕</h1>
  <a href="../index.html" style="color:var(--muted);font-size:20px;text-decoration:none">← 返回小遊戲</a>
  <div id="roundInfo"></div>
  <div>房間 <b id="roomCode">----</b></div>
</header>

<section id="lobby" class="panel hidden">
  <div class="qrbox">
    <div id="qr"></div>
    <p>掃 QR 加入</p>
    <small id="joinUrl"></small>
  </div>
  <div class="playersbox">
    <div class="pc">玩家 <b id="playerCount">0 / 15</b></div>
    <div id="players" class="players"></div>
    <button id="startBtn" class="big" disabled>開始遊戲</button>
    <p id="startHint" class="hint"></p>
  </div>
</section>

<section id="stage" class="panel pstage hidden">
  <div class="scene" id="scene"></div>
  <div class="side">
    <div class="clockwrap">
      <svg id="clock" class="clock" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" class="face"/>
        <g id="ticks"></g>
        <line id="hand" x1="100" y1="112" x2="100" y2="24" class="hand"/>
        <circle cx="100" cy="100" r="6" class="pin"/>
      </svg>
      <div id="count" class="count"></div>
    </div>
    <div id="status" class="status"></div>
    <div id="pressed" class="sub"></div>
  </div>
</section>

<section id="result" class="panel pres hidden">
  <div class="scene" id="scene2"></div>
  <div class="resside">
    <h2 id="resultTitle"></h2>
    <ol id="ranking" class="ranking"></ol>
    <button id="nextBtn" class="big">下一局</button>
  </div>
</section>

<section id="final" class="panel hidden">
  <h2>總結果</h2>
  <ol id="board" class="ranking"></ol>
  <button id="againBtn" class="big">再玩一次（同一班人）</button>
  <p class="hint">玩家唔使重新掃 QR，手機會自動返去準備畫面</p>
</section>

<footer class="credits">
  <a href="https://www.flaticon.com/free-icons/crown" title="crown icons" target="_blank" rel="noopener">Crown icons created by Darius Dan - Flaticon</a>
  <a href="https://www.flaticon.com/free-icons/strawberry-cake" title="strawberry cake icons" target="_blank" rel="noopener">Strawberry cake icons created by Mihimihi - Flaticon</a>
  <a href="https://www.flaticon.com/free-icons/cake" title="cake icons" target="_blank" rel="noopener">Cake icons created by Magnific - Flaticon</a>
  <a href="https://www.flaticon.com/free-icons/breakfast" title="breakfast icons" target="_blank" rel="noopener">Breakfast icons created by Magnific - Flaticon</a>
</footer>

<script src="tv.js"></script>
</body>
</html>
