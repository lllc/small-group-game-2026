<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小組遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1b17;
    --panel: #163028;
    --panel-2: #1f3f35;
    --ink: #f7f3e8;
    --muted: #a9c2b8;
    --gold: #f2c14e;
    --ok: #6fd08c;
    --bad: #ff6b5b;
    --font: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--gold); outline-offset: 4px; }

  .screen { display: none; height: 100%; min-height: 100vh; padding: 28px 40px; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Home ---------- */
  #home { justify-content: center; align-items: center; gap: 56px; }
  #home h1 { font-size: clamp(48px, 7vw, 96px); font-weight: 900; margin: 0; letter-spacing: 0.02em; }
  .menu { display: grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 32px; width: min(1100px, 100%); }
  .card {
    background: var(--panel); text-align: left; padding: 44px 44px 40px; border-radius: 28px;
    display: flex; flex-direction: column; gap: 14px; min-height: 260px;
    box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .2s, background .2s;
  }
  .card:hover, .card:focus-visible { background: var(--panel-2); box-shadow: inset 0 0 0 3px var(--gold); }
  .card b { font-size: clamp(36px, 4vw, 56px); font-weight: 900; }
  .card small { font-size: clamp(22px, 2.2vw, 30px); color: var(--muted); line-height: 1.5; }

  /* ---------- Shared bar ---------- */
  .bar { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 20px; }
  .back, .primary, .ghost {
    font-size: 26px; font-weight: 700; padding: 14px 28px; border-radius: 16px;
  }
  .back { background: var(--panel); }
  .back:hover { background: var(--panel-2); }
  .primary { background: var(--gold); color: #1a1405; font-weight: 900; }
  .primary:hover { filter: brightness(1.06); }
  .ghost { background: var(--panel); }
  .stats { display: flex; gap: 40px; font-size: 28px; color: var(--muted); }
  .stats b { color: var(--ink); font-size: 40px; font-weight: 900; margin-left: 8px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 26px; color: var(--muted); }
  select, input[type=range] { font-size: 24px; }
  select { background: var(--panel); border: 0; border-radius: 12px; padding: 10px 16px; color: var(--ink); }
  .hidden { display: none !important; }

  /* ---------- Schulte ---------- */
  .board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  #grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    width: min(92vw, calc(100vh - 230px)); aspect-ratio: 1;
  }
  .cell {
    background: var(--panel); border-radius: 14px; font-size: clamp(32px, 5.4vh, 64px);
    font-weight: 900; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, transform .15s;
  }
  .cell:hover { background: var(--panel-2); }
  .cell.done { background: var(--ok); color: #0c2415; transform: scale(0.94); }
  #grid.floating { display: block; position: relative; }
  #grid.floating .cell { position: absolute; width: calc((100% - 50px) / 6); height: auto; aspect-ratio: 1; }
  .cell.wrong { background: var(--bad); color: #2a0b06; animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); }
  }
  .sr-note { font-size: 24px; color: var(--muted); text-align: center; margin: 10px 0 0; min-height: 34px; }

  .result {
    position: fixed; inset: 0; background: rgba(8, 16, 13, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 40px;
  }
  .result h2 { font-size: clamp(48px, 7vw, 92px); margin: 0; color: var(--gold); font-weight: 900; }
  .result p { font-size: clamp(30px, 3.6vw, 48px); margin: 0; line-height: 1.6; }

  /* ---------- Stroop ---------- */
  .st-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--panel); border-radius: 36px; margin: 4px 0 0; padding: 24px; transition: background .15s; }
  .st-stage.hit { background: #24482f; }
  .st-stage.miss { background: #5a2320; }
  .st-bar { width: min(80%, 900px); height: 18px; background: var(--panel-2); border-radius: 9px; overflow: hidden; }
  .st-bar i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 9px; }
  .st-bar i.run { animation: stBar linear forwards; }
  @keyframes stBar { from { width: 100%; } to { width: 0; } }
  #stWord { font-size: clamp(120px, 24vh, 240px); font-weight: 900; line-height: 1.1; min-height: 1.1em; }
  .st-answers { display: none; grid-template-columns: repeat(5, 1fr); gap: 20px; margin: 24px 0 0; }
  .st-ans { background: var(--panel); border-radius: 22px; padding: 22px 12px; font-size: clamp(30px, 3.4vw, 44px); font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .st-ans:hover { background: var(--panel-2); }
  .st-ans i { width: 34px; height: 34px; border-radius: 50%; display: inline-block; }
  .st-ans .key { font-size: 22px; color: var(--muted); font-weight: 700; margin-left: 6px; }

  .st-answers.off { opacity: .35; pointer-events: none; }
  button:disabled { opacity: .4; cursor: default; }
  .st-slot.ans { background: var(--gold); color: #1a1405; }
  .st-slot.big { height: auto; min-height: 110px; min-width: 0; padding: 10px 24px; font-size: clamp(48px, 8vh, 90px); background: var(--panel-2); }
  #stWord.pill { background: #f7f3e8; border-radius: 40px; padding: 0 .3em; }
  .st-ans i { box-shadow: 0 0 0 2px var(--muted); }
  .st-slots { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; min-height: 80px; }
  .st-slot { min-width: 110px; height: 80px; padding: 0 14px; border-radius: 16px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; }
  .st-slot.ok { background: var(--ok); color: #0c2415; }
  .st-slot.bad { background: var(--bad); color: #2a0b06; }

  /* ---------- Beat ---------- */
  .stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.5vh, 28px);
    border-radius: 36px; background: var(--panel); margin: 4px 0 24px; padding: 24px;
    transition: background .12s;
  }
  .stage.strong { background: #24482f; }
  .seq { display: grid; grid-template-columns: repeat(5, min(12vh, 120px)); gap: 12px; justify-content: center; }
  .seq .item {
    background: var(--panel-2); border-radius: 18px; aspect-ratio: 1.15;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(36px, 6.5vh, 76px); font-weight: 900; font-variant-numeric: tabular-nums;
    transition: background .1s, color .1s, opacity .2s, transform .1s;
  }
  .seq .item.past { opacity: .35; }
  .seq .item.cur { background: var(--gold); color: #1a1405; transform: scale(1.08); }
  .beat-dots { display: flex; gap: 22px; }
  .beat-dots span { width: 26px; height: 26px; border-radius: 50%; background: var(--panel-2); transition: background .08s; }
  .beat-dots span.on { background: var(--muted); }
  .beat-dots span.on.first { background: var(--gold); }
  #bWord { font-size: clamp(32px, 4.5vw, 56px); font-weight: 700; color: var(--gold); min-height: 1.2em; }
  #fingers { display: flex; align-items: flex-end; gap: 22px; height: clamp(110px, 18vh, 200px); }
  .finger {
    width: clamp(40px, 5vw, 72px); height: 45%; border-radius: 40px;
    background: #3c6b57; transition: height .12s ease, background .12s;
  }
  .finger.up { height: 100%; background: var(--gold); }
  .hint { font-size: 24px; color: var(--muted); text-align: center; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<section id="home" class="screen active" aria-label="遊戲選單">
  <h1>小組遊戲</h1>
  <div class="menu">
    <button class="card" data-go="schulte">
      <b>舒爾特方格</b>
      <small>按 1 至 36 嘅次序逐個點擊，限時 60 秒。方格會動，要留意位置變化。</small>
    </button>
    <button class="card" data-go="beat">
      <b>跟拍手勢</b>
      <small>跟住節拍，睇畫面顯示嘅數字，即刻用手指做出同樣數目。</small>
    </button>
    <button class="card" data-go="stroop">
      <b>Stroop 顏色字</b>
      <small>睇清字嘅顏色，唔好睇字嘅意思。大家講出顏色，主持人撳對應按鈕。</small>
    </button>
    <button class="card" onclick="location.href='cake/tv.html'">
      <b>搶蛋糕（多人）</b>
      <small>最多 15 人，掃 QR 加入，睇住電視時鐘，搶喺 0 秒撳掣。電視用呢個連結，手機掃 QR。</small>
    </button>
  </div>
</section>

<!-- ========== SCHULTE ========== -->
<section id="schulte" class="screen" aria-label="舒爾特方格">
  <div class="bar">
    <button class="back" data-home>← 返回</button>
    <div class="stats">
      <div>剩餘 <b id="sTime">60</b> 秒</div>
      <div>下一個 <b id="sNext">1</b></div>
      <div>完成組數 <b id="sRounds">0</b></div>
    </div>
  </div>
  <div class="bar">
    <div class="controls">
      動態打亂
      <select id="sShuffle">
        <option value="0" selected>關</option>
        <option value="10000">10秒</option>
        <option value="20000">20秒</option>
        
      </select>
      數字飄動
      <select id="sFloat">
        <option value="0" selected>關</option>
        <option value="8">慢</option>
        <option value="16">中</option>
        <option value="28">快</option>
      </select>
      方式
      <select id="sFloatMode">
        <option value="walk">遊走</option>
        <option value="wobble" selected>浮動</option>
      </select>
    </div>
    <button id="sRestart" class="ghost">重新開始</button>
    <button id="sStart" class="primary">開始</button>
  </div>
  <div class="board-wrap">
    <div id="grid" role="grid" aria-label="1 至 36 數字方格"></div>
  </div>
  <p class="sr-note" id="sNote">撳「開始」後，由 1 開始點擊。</p>
  <div id="sResult" class="result hidden" role="dialog" aria-live="polite"></div>
</section>

<!-- ========== STROOP ========== -->
<section id="stroop" class="screen" aria-label="Stroop 顏色字">
  <div class="bar">
    <button class="back" data-home>← 返回</button>
    <div class="stats">
      <div>第 <b id="stQ">0</b> / <b id="stTotal">20</b> 題</div>
    </div>
  </div>
  <div class="bar">
    <div class="controls">
      題數
      <select id="stCount">
        <option value="10">10 題</option>
        <option value="20" selected>20 題</option>
        <option value="30">30 題</option>
      </select>
      每題
      <select id="stTime">
        <option value="4000">4 秒</option>
        <option value="5000" selected>5 秒</option>
        <option value="10000">10 秒</option>
      </select>
      難度
      <select id="stLevel">
        <option value="3">容易（記 3 個）</option>
        <option value="5" selected>中等（記 5 個）</option>
        <option value="7">困難（記 7 個）</option>
      </select>
    </div>
    <div class="controls">
      <button id="stRestart" class="ghost">重新開始</button>
      <button id="stStart" class="primary">開始</button>
    </div>
  </div>
  <div class="st-stage" id="stStage">
    <div class="st-bar"><i id="stBar"></i></div>
    <div id="stWord">撳「開始」</div>
    <div class="st-slots" id="stSlots"></div>
    <p class="sr-note" id="stNote">睇字嘅「顏色」，唔好睇字嘅意思。唔使即刻答，每 5 題有一次小休息，到時憑記憶講出順序答案。</p>
  </div>
  <div class="st-answers off" id="stAns"></div>
  <div id="stResult" class="result hidden" role="dialog" aria-live="polite"></div>
</section>

<!-- ========== BEAT ========== -->
<section id="beat" class="screen" aria-label="跟拍手勢">
  <div class="bar">
    <button class="back" data-home>← 返回</button>
    <div class="stats">
      <div>已跟 <b id="bDone">0</b> / <b id="bGoal">32</b> 拍</div>
    </div>
  </div>
  <div class="controls">
    速度
    <input type="range" id="bpm" min="40" max="140" value="80" step="2" aria-label="速度">
    <b id="bpmVal" style="color:var(--ink)">80</b> BPM
    行數
    <select id="bRows" aria-label="行數">
      <option value="1">1 行</option>
      <option value="2">2 行</option>
      <option value="3">3 行</option>
      <option value="4" selected>4 行</option>
    </select>
    節拍數
    <select id="bTotal" aria-label="節拍數">
      <option value="16">16 拍</option>
      <option value="32" selected>32 拍</option>
      <option value="64">64 拍</option>
      <option value="0">無限</option>
    </select>
    模式
    <select id="bMode" aria-label="模式">
      <option value="rand">隨機</option>
      <option value="seq">順序 0→5→0</option>
    </select>
    <label><input type="checkbox" id="bSound" checked> 節拍聲</label>
    <label><input type="checkbox" id="bBgm" checked> 背景音樂</label>
    <button id="bRestart" class="ghost" style="margin-left:auto">重新開始</button>
    <button id="bStart" class="primary">開始</button>
  </div>
  <div class="stage" id="stage">
    <div class="seq" id="seq"></div>
    <div class="beat-dots" id="beatDots"><span></span><span></span><span></span><span></span></div>
    <div id="bWord">撳「開始」</div>
    <div id="fingers" aria-label="手指數目"></div>
  </div>
  <p class="hint">空格鍵開始 / 暫停　·　Esc 返回選單</p>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const screens = document.querySelectorAll(".screen");

  /* ---------- Navigation ---------- */
  function show(id) {
    stopSchulte();
    stopBeat();
    resetBeat();
    stopStroop();
    screens.forEach(s => s.classList.toggle("active", s.id === id));
  }
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));
  document.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => show("home")));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") show("home");
    if (e.key === " " && $("beat").classList.contains("active")) {
      e.preventDefault();
      toggleBeat();
    }
  });

  /* ================= SCHULTE ================= */
  const TOTAL = 36, LIMIT = 60000;
  let S = { pos: {}, order: [], target: 1, found: 0, rounds: 0, errors: 0, endAt: 0, running: false, tick: null, shuffle: null };

  const shuffleArr = (a) => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function newGrid() {
    S.order = shuffleArr(Array.from({ length: TOTAL }, (_, i) => i + 1));
    renderGrid();
  }

  function renderGrid() {
    $("grid").innerHTML = S.order
      .map(n => `<button class="cell${n < S.target ? " done" : ""}" data-n="${n}" role="gridcell" aria-label="${n}">${n}</button>`)
      .join("");
  }

  function updateStats(remainingMs) {
    const secs = Math.ceil(Math.max(0, remainingMs) / 1000);
    $("sTime").textContent = secs;
    $("sNext").textContent = Math.min(S.target, TOTAL);
    $("sRounds").textContent = S.rounds;
  }

  function startSchulte() {
    S.target = 1; S.found = 0; S.rounds = 0; S.errors = 0;
    $("sResult").classList.add("hidden");
    newGrid();
    S.running = true;
    S.endAt = Date.now() + LIMIT;
    $("sStart").textContent = "暫停";
    $("sNote").textContent = "點擊亮起嘅數字：1 → 36。";
    updateStats(LIMIT);

    S.tick = setInterval(() => {
      const left = S.endAt - Date.now();
      if (left <= 0) { endSchulte(); return; }
      updateStats(left);
    }, 100);

    const every = Number($("sShuffle").value);
    if (every > 0) {
      S.shuffle = setInterval(() => {
        if (!S.running) return;
        shuffleArr(S.order);
        renderGrid();
      }, every);
    }
  }

  function pauseSchulte() {
    if (!S.running) return;
    S.running = false;
    clearInterval(S.tick); clearInterval(S.shuffle);
    S.tick = S.shuffle = null;
    S.remaining = S.endAt - Date.now();
    $("sStart").textContent = "繼續";
    $("sNote").textContent = "已暫停。";
  }

  function resumeSchulte() {
    S.running = true;
    S.endAt = Date.now() + S.remaining;
    $("sStart").textContent = "暫停";
    $("sNote").textContent = "點擊亮起嘅數字：1 → 36。";
    S.tick = setInterval(() => {
      const left = S.endAt - Date.now();
      if (left <= 0) { endSchulte(); return; }
      updateStats(left);
    }, 100);
    const every = Number($("sShuffle").value);
    if (every > 0) {
      S.shuffle = setInterval(() => {
        if (!S.running) return;
        shuffleArr(S.order);
        renderGrid();
      }, every);
    }
  }

  function stopSchulte(silent) {
    S.running = false;
    clearInterval(S.tick); clearInterval(S.shuffle);
    S.tick = S.shuffle = null;
    if (!silent) $("sStart").textContent = "開始";
    S.remaining = 0;
  }

  function endSchulte() {
    stopSchulte();
    updateStats(0);
    $("sStart").textContent = "再玩一次";
    const box = $("sResult");
    box.innerHTML = `
      <h2>時間到！</h2>
      <p>完成 <b>${S.rounds}</b> 組　·　找到 <b>${S.found}</b> 個數字<br>錯誤 <b>${S.errors}</b> 次</p>
      <button class="primary" id="sAgain">再玩一次</button>
      <button class="ghost" data-home style="font-size:26px;padding:14px 28px;border-radius:16px">返回選單</button>`;
    box.classList.remove("hidden");
    $("sAgain").addEventListener("click", () => { box.classList.add("hidden"); startSchulte(); });
    box.querySelector("[data-home]").addEventListener("click", () => show("home"));
    $("sNote").textContent = "";
  }

  $("sStart").addEventListener("click", () => {
    if (S.running) pauseSchulte();
    else if ($("sStart").textContent === "繼續") resumeSchulte();
    else startSchulte();
  });

  $("sRestart").addEventListener("click", () => {
    stopSchulte();
    startSchulte();
  });

  $("sShuffle").addEventListener("change", () => {
    if (!S.running) return;
    clearInterval(S.shuffle);
    const every = Number($("sShuffle").value);
    if (every > 0) {
      S.shuffle = setInterval(() => { shuffleArr(S.order); renderGrid(); }, every);
    }
  });

  /* ----- floating numbers (positions are kept per number, in % of the board) ----- */
  let FLOAT_LAST = 0;
  function floatFrame(now) {
    const dt = FLOAT_LAST ? Math.min((now - FLOAT_LAST) / 1000, 0.05) : 0;
    FLOAT_LAST = now;
    const mode = $("sFloatMode").value;
    const speed = Number($("sFloat").value) || (mode === "wobble" ? 8 : 0);
    const grid = $("grid");
    grid.classList.toggle("floating", speed > 0);
    if (speed > 0) {
      const W = 15, step = speed * dt;
      grid.querySelectorAll(".cell").forEach(el => {
        const n = el.dataset.n;
        let p = S.pos[n];
        if (!p) {
          const a = Math.random() * Math.PI * 2;
          p = S.pos[n] = { x: Math.random() * (100 - W), y: Math.random() * (100 - W), vx: Math.cos(a), vy: Math.sin(a) };
        }
        if ($("sFloatMode").value === "wobble") {
          const idx = S.order.indexOf(Number(n));
          const col = idx % 6, row = Math.floor(idx / 6);
          if (p.ph === undefined) p.ph = Math.random() * 6.28;
          const t = now / 1000, amp = speed * 0.8 * (S.running ? 1 : 0);
          const dx = Math.sin(t * 2.4 + p.ph) * amp, dy = Math.cos(t * 1.9 + p.ph) * amp;
          el.style.left = `calc(${col} * ((100% - 50px) / 6 + 10px) + ${dx.toFixed(1)}px)`;
          el.style.top = `calc(${row} * ((100% - 50px) / 6 + 10px) + ${dy.toFixed(1)}px)`;
          return;
        }
        if (S.running && dt > 0) {
          p.x += p.vx * step; p.y += p.vy * step;
          if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
          if (p.x > 100 - W) { p.x = 100 - W; p.vx = -Math.abs(p.vx); }
          if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); }
          if (p.y > 100 - W) { p.y = 100 - W; p.vy = -Math.abs(p.vy); }
        }
        el.style.left = p.x + "%";
        el.style.top = p.y + "%";
      });
    }
    requestAnimationFrame(floatFrame);
  }
  requestAnimationFrame(floatFrame);

  $("grid").addEventListener("click", (e) => {
    const el = e.target.closest(".cell");
    if (!el || !S.running) return;
    const n = Number(el.dataset.n);

    if (n === S.target) {
      el.classList.add("done");
      S.found++;
      S.target++;
      if (S.target > TOTAL) {
        S.rounds++;
        S.target = 1;
        newGrid();
      }
      $("sNext").textContent = Math.min(S.target, TOTAL);
      $("sRounds").textContent = S.rounds;
      $("sNote").textContent = S.target > TOTAL ? "" : `下一個：${S.target}`;
    } else if (!el.classList.contains("done")) {
      S.errors++;
      el.classList.add("wrong");
      $("sNote").textContent = `錯咗，要搵 ${S.target}。`;
      setTimeout(() => el.classList.remove("wrong"), 380);
    }
  });

  /* ================= STROOP ================= */
  const ST_COLORS = [
    { name: "紅", hex: "#ff4d4d" },
    { name: "橙", hex: "#ff9f1c" },
    { name: "黃", hex: "#ffe033" },
    { name: "綠", hex: "#3ddc84" },
    { name: "藍", hex: "#3d8bff" },
    { name: "紫", hex: "#b46cff" },
    { name: "白", hex: "#ffffff" },
    { name: "黑", hex: "#000000" }
  ];
  const NC = ST_COLORS.length;
  const ST = {
    q: 0, total: 20, ok: 0, bad: 0, history: [], words: [], ink: -1, limit: 5000,
    phase: "idle", running: false, qTimer: null,
    lastBreakAt: 0, recallSeq: [], recallAns: [], recallPos: 0
  };

  $("stAns").innerHTML = ST_COLORS.map((c, i) => `<button class="st-ans" data-i="${i}"><i style="background:${c.hex}"></i>${c.name}<span class="key">${i + 1}</span></button>`).join("");

  function setStBtn(label, enabled) {
    const b = $("stStart");
    b.textContent = label;
    b.disabled = !enabled;
  }

  function stUpdate() {
    $("stQ").textContent = ST.q;
    $("stTotal").textContent = ST.total;
  }

  function stopStroop() {
    ST.running = false;
    ST.phase = "idle";
    clearTimeout(ST.qTimer);
    $("stBar").classList.remove("run");
    $("stAns").classList.add("off");
    setStBtn("開始", true);
  }

  // one question, shown for a fixed time; nobody answers yet
  function stNext() {
    if (!ST.running) return;
    if (ST.q > 0 && ST.q % 5 === 0 && ST.q !== ST.lastBreakAt) {
      ST.lastBreakAt = ST.q;
      startRecall();
      return;
    }
    if (ST.q >= ST.total) { stFinish(); return; }

    ST.q++;
    ST.phase = "q";
    $("stAns").classList.add("off");
    setStBtn("進行中…", false);

    // no colour repeats within any 5 consecutive questions (word and ink)
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const all = [...Array(NC).keys()];
    const ink = pick(all.filter(c => !ST.history.slice(-4).includes(c)));
    const word = pick(all.filter(c => c !== ink && !ST.words.slice(-4).includes(c)));
    ST.ink = ink;
    ST.history.push(ink);
    ST.words.push(word);
    ST.limit = Number($("stTime").value);

    const w = $("stWord");
    w.textContent = ST_COLORS[word].name;
    w.style.color = ST_COLORS[ink].hex;
    $("stStage").classList.remove("hit", "miss");
    $("stSlots").innerHTML = "";
    $("stNote").textContent = "睇清楚字嘅顏色，記住就得，唔使即刻答。";

    const bar = $("stBar");
    bar.classList.remove("run");
    void bar.offsetWidth;
    bar.style.animationDuration = ST.limit + "ms";
    bar.classList.add("run");

    stUpdate();
    clearTimeout(ST.qTimer);
    ST.qTimer = setTimeout(stNext, ST.limit);
  }

  // break: a participant says the colours of the last N questions, in order
  function startRecall() {
    const n = Math.min(ST.history.length, Number($("stLevel").value));
    ST.recallSeq = ST.history.slice(-n);
    ST.phase = "recall";
    clearTimeout(ST.qTimer);
    $("stBar").classList.remove("run");
    $("stStage").classList.remove("hit", "miss");
    const w = $("stWord");
    w.textContent = "小休息";
    w.style.color = "";
    $("stSlots").innerHTML = ST.recallSeq.map((_, i) => `<div class="st-slot">${i + 1}</div>`).join("");
    setStBtn("Show Ans", true);
    $("stNote").textContent = `請一位參加者由第一個開始，講出最近 ${n} 題嘅顏色（按次序）。講完撳「Show Ans」。`;
  }

  // show the correct sequence, large, each in its own colour
  function revealRecall() {
    if (ST.phase !== "recall") return;
    ST.phase = "reveal";
    const w = $("stWord");
    w.textContent = "答案";
    w.style.color = "";
    $("stSlots").innerHTML = ST.recallSeq.map(ink => {
      const c = ST_COLORS[ink];
      const shadow = c.hex === "#000000" ? "text-shadow: 0 0 4px #fff, 0 0 2px #fff;" : "";
      return `<div class="st-slot big" style="color:${c.hex};${shadow}">${c.name}</div>`;
    }).join("");
    $("stNote").textContent = "撳「開始」進入下一題。";
    setStBtn(ST.q >= ST.total ? "完成" : "開始", true);
  }

  function stFinish() {
    stopStroop();
    $("stWord").classList.remove("pill");
    $("stWord").textContent = "完成！";
    $("stWord").style.color = "";
    const box = $("stResult");
    box.innerHTML = `
      <h2>完成！</h2>
      <p>完成 <b>${ST.total}</b> 題</p>
      <button class="primary" id="stAgain">重新開始</button>
      <button class="ghost" data-home style="font-size:26px;padding:14px 28px;border-radius:16px">返回選單</button>`;
    box.classList.remove("hidden");
    $("stAgain").addEventListener("click", () => { box.classList.add("hidden"); stStart(); });
    box.querySelector("[data-home]").addEventListener("click", () => show("home"));
  }

  function stStart() {
    stopStroop();
    ST.q = 0; ST.ok = 0; ST.bad = 0; ST.history = []; ST.words = []; ST.lastBreakAt = 0;
    ST.total = Number($("stCount").value);
    ST.running = true;
    $("stResult").classList.add("hidden");
    $("stWord").style.color = "";
    stUpdate();
    stNext();
  }

  // main button: start / show answers / next question, depending on the step
  function stMainBtn() {
    if (ST.phase === "recall") revealRecall();
    else if (ST.phase === "reveal") stNext();
    else stStart();
  }

  $("stStart").addEventListener("click", stMainBtn);
  $("stRestart").addEventListener("click", stStart);
  /* ================= BEAT ================= */
  const SEQ = [0, 1, 2, 3, 4, 5, 4, 3, 2, 1];
  const WORDS = ["零", "一", "二", "三", "四", "五"];
  let B = { timer: null, beat: 0, count: 0, cur: -1, seq: [], seqIdx: 0, ctx: null, running: false, finished: false, flashT: null };

  // build finger pictogram once
  $("fingers").innerHTML = Array.from({ length: 5 }, () => '<div class="finger"></div>').join("");

  function ensureAudio() {
    if (!B.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) B.ctx = new AC();
    }
    if (B.ctx && B.ctx.state === "suspended") B.ctx.resume();
  }

  function click(strong) {
    if (!$("bSound").checked || !B.ctx) return;
    const o = B.ctx.createOscillator();
    const g = B.ctx.createGain();
    o.frequency.value = strong ? 1200 : 820;
    g.gain.setValueAtTime(0.25, B.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, B.ctx.currentTime + 0.09);
    o.connect(g).connect(B.ctx.destination);
    o.start();
    o.stop(B.ctx.currentTime + 0.1);
  }

  function pickNumber(prev) {
    if ($("bMode").value === "seq") {
      const n = SEQ[B.seqIdx % SEQ.length];
      B.seqIdx++;
      return n;
    }
    let n;
    do { n = Math.floor(Math.random() * 6); } while (n === prev);
    return n;
  }

  // empty row(s) shown before the game starts
  function placeholder() {
    const len = Number($("bRows").value) * 5;
    $("seq").innerHTML = Array.from({ length: len }, () => '<div class="item">–</div>').join("");
  }

  // a new row (or block of rows) of numbers, 5 per row
  function genRow() {
    const len = Number($("bRows").value) * 5;
    let prev = B.seq.length ? B.seq[B.seq.length - 1] : undefined;
    const row = [];
    for (let i = 0; i < len; i++) {
      const n = pickNumber(prev);
      row.push(n);
      prev = n;
    }
    B.seq = row;
    B.cur = -1;
    $("seq").innerHTML = B.seq.map(n => `<div class="item">${n}</div>`).join("");
  }

  function highlight() {
    $("seq").querySelectorAll(".item").forEach((el, i) => {
      el.classList.toggle("cur", i === B.cur);
      el.classList.toggle("past", i < B.cur);
    });
  }

  function showNumber(n) {
    $("bWord").textContent = WORDS[n];
    document.querySelectorAll(".finger").forEach((f, i) => f.classList.toggle("up", i < n));
  }

  // simple synthesized upbeat loop (C - Am - F - G), follows the beat
  const CHORDS = [
    { bass: 65.4, arp: [261.6, 329.6, 392.0] },
    { bass: 55.0, arp: [220.0, 261.6, 329.6] },
    { bass: 87.3, arp: [174.6, 220.0, 261.6] },
    { bass: 98.0, arp: [196.0, 246.9, 293.7] }
  ];

  function tone(freq, dur, type, vol) {
    if (!B.ctx) return;
    const t = B.ctx.currentTime;
    const o = B.ctx.createOscillator();
    const g = B.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(B.ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function playBgm(beat, strong) {
    if (!$("bBgm").checked || !B.ctx) return;
    const ch = CHORDS[Math.floor(beat / 4) % CHORDS.length];
    if (strong) tone(ch.bass, 0.35, "triangle", 0.2);
    tone(ch.arp[beat % 3], 0.18, "square", 0.04);
    if (beat % 2 === 1) tone(ch.arp[(beat + 1) % 3] * 2, 0.12, "triangle", 0.03);
  }

  function onBeat() {
    const goal = Number($("bTotal").value);
    if (goal && B.count >= goal) { finish(); return; }

    if (B.cur + 1 >= B.seq.length) genRow();
    B.cur++;

    const pos = B.beat % 4;
    const strong = pos === 0;
    document.querySelectorAll("#beatDots span").forEach((d, i) => {
      d.classList.toggle("on", i === pos);
      d.classList.toggle("first", i === pos && strong);
    });
    showNumber(B.seq[B.cur]);
    highlight();
    click(strong);
    playBgm(B.beat, strong);

    const stage = $("stage");
    stage.classList.toggle("strong", strong);
    clearTimeout(B.flashT);
    B.flashT = setTimeout(() => stage.classList.remove("strong"), 140);

    B.beat++;
    B.count++;
    $("bDone").textContent = B.count;
  }

  function finish() {
    stopBeat();
    B.finished = true;
    $("bWord").textContent = "完成！";
    $("bStart").textContent = "再玩一次";
    showNumber(0);
  }

  function stopBeat() {
    B.running = false;
    clearInterval(B.timer);
    B.timer = null;
    if ($("bStart") && !B.finished) $("bStart").textContent = B.count > 0 ? "繼續" : "開始";
  }

  function resetBeat() {
    B.running = false;
    clearInterval(B.timer);
    B.timer = null;
    B.count = 0; B.beat = 0; B.cur = -1; B.seq = []; B.seqIdx = 0; B.finished = false;
    $("bDone").textContent = 0;
    $("bGoal").textContent = Number($("bTotal").value) || "∞";
    $("bWord").textContent = "撳「開始」";
    $("bStart").textContent = "開始";
    showNumber(0);
    placeholder();
  }

  function startBeat() {
    ensureAudio();
    if (B.finished) resetBeat();
    const fresh = B.count === 0;
    B.running = true;
    $("bStart").textContent = "暫停";
    $("bGoal").textContent = Number($("bTotal").value) || "∞";
    if (fresh) onBeat();
    B.timer = setInterval(onBeat, 60000 / Number($("bpm").value));
  }

  function toggleBeat() {
    if (B.running) stopBeat();
    else startBeat();
  }

  $("bStart").addEventListener("click", toggleBeat);

  $("bRestart").addEventListener("click", () => {
    stopBeat();
    resetBeat();
    startBeat();
  });

  $("bpm").addEventListener("input", () => {
    $("bpmVal").textContent = $("bpm").value;
    if (B.running) {
      clearInterval(B.timer);
      B.timer = setInterval(onBeat, 60000 / Number($("bpm").value));
    }
  });

  $("bMode").addEventListener("change", () => { B.seqIdx = 0; });

  $("bRows").addEventListener("change", () => {
    if (!B.running && B.count === 0) placeholder();
  });

  $("bTotal").addEventListener("change", () => {
    if (!B.running && B.count === 0) $("bGoal").textContent = Number($("bTotal").value) || "∞";
  });

  placeholder();
})();
</script>
</body>
</html>
